# GM 통합관리도구
#   수파베이스(DB · 로그인 · 파일)는 이미 서버에 따로 떠 있는 셀프호스팅을 씁니다.
#   여기서는 웹앱(nginx)과 관리 API 두 개만 띄웁니다.
name: gm-integrated

services:
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-http://host.docker.internal:8000}
      GM_PUBLIC_SUPABASE_URL: ${GM_PUBLIC_SUPABASE_URL:-}
      NGINX_ENVSUBST_FILTER: "SUPABASE_INTERNAL_URL"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [api]

  api:
    build: ./api
    restart: unless-stopped
    environment:
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-http://host.docker.internal:8000}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-gmconst}
      ADMIN_TEMP_PASSWORD: ${ADMIN_TEMP_PASSWORD:-gmconst}
      STT_URL: ${STT_URL:-http://stt:9000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      LICENSE_URL: ${LICENSE_URL:-}
      LICENSE_KEY: ${LICENSE_KEY:-}
      WEB_INTERNAL_URL: http://web:80
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 회의 녹음 받아쓰기 (faster-whisper). 녹음은 이 서버 밖으로 나가지 않습니다.
  # 켜기: .env 에 COMPOSE_PROFILES=stt  (처음 한 번 모델 약 1.6GB 내려받음)
  stt:
    build: ./stt
    profiles: ["stt"]
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_COMPUTE: ${WHISPER_COMPUTE:-int8}
      WHISPER_THREADS: ${WHISPER_THREADS:-0}
    volumes:
      - stt-models:/models

  # WORKNIUM 라이선스 서버 — 대표님 서버에서만 켭니다 (고객사에는 설치하지 않음)
  # 켜기: .env 의 COMPOSE_PROFILES 에 license 추가 (예: COMPOSE_PROFILES=stt,license)
  license:
    build: { context: ., dockerfile: licensing/server/Dockerfile }
    profiles: ["license"]
    restart: unless-stopped
    ports:
      - "${LICENSE_PORT:-8090}:3100"
    volumes:
      - license-data:/data

volumes:
  stt-models:
  license-data:
