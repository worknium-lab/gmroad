# 안드로이드 APK 자동 빌드 → 릴리스 'android-latest'에 gm.apk로 올림
#   폰에서 받기: https://github.com/worknium-lab/gmroad/releases/download/android-latest/gm.apk
name: android-apk
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: 서명키 꺼내기
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "has=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/gm.jks"; echo "has=yes" >> "$GITHUB_OUTPUT"
      - name: APK 빌드
        working-directory: android
        env:
          GM_KEYSTORE: ${{ runner.temp }}/gm.jks
          GM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon ${{ steps.key.outputs.has == 'yes' && 'assembleRelease' || 'assembleDebug' }}
      - name: 서명키 없음
        if: steps.key.outputs.has != 'yes'
        run: |
          echo "::error::빌드 확인만 했습니다. 설치용 APK를 만들려면 GitHub 비밀값 ANDROID_KEYSTORE_B64 · ANDROID_KEYSTORE_PASSWORD 를 넣으세요 (Settings › Secrets and variables › Actions)"
          exit 1
      - name: 릴리스에 올리기
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk gm.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "GM 통합관리 안드로이드 앱" --notes "폰에서 gm.apk를 눌러 설치하세요. Tailscale을 먼저 켜야 합니다."
          gh release upload android-latest gm.apk --clobber
          gh release edit android-latest --notes "폰에서 gm.apk를 눌러 설치하세요. Tailscale을 먼저 켜야 합니다. (빌드 ${{ github.run_number }}, $(date -u +%F))"
